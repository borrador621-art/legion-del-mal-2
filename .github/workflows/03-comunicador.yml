name: Comunicador de la legión


on:
  workflow_dispatch:
    inputs:
      villano:
        description: '¿qué villano envía el mensaje?'
        required: true
        type: choice
        options:
          - Darth Vader
          - Thanos
          - Joker
          - Mistic

      mensaje:
        description: 'Mensaje para el consejo de villanos'
        required: true
        default: 'La misión ha sido completada con éxito'

      prioridad:
        description: 'Nivel de prioridad del mensaje'
        required: true
        type: choice
        options:
          - 💚 Normal
          - 💛 Alta 
          - 🩷 Crítico

jobs:
  transmitir-mensaje: 
    runs-on: ubuntu-latest
    steps:
      - name: Imprimir inputs
        run: |
          echo "Inputs:
          echo ""
          echo "Villano: ${{ inputs.villano }}"
          echo "Mensaje: ${{ inputs.mensaje }}"
          echo "Nivel: ${{ inputs.prioridad }}"