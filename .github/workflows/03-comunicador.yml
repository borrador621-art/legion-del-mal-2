name: Comunicador de la legión


on:
  workflow_dispatch:
    inputs:
      villano:
        description: '¿qué villano envía el mensaje?'
        required: true
        type: choice
        options:
          - Darth Vader
          - Thanos
          - Joker
          - Mistic

      mensaje:
        description: 'Mensaje para el consejo de villanos'
        required: true
        default: 'La misión ha sido completada con éxito'

      prioridad:
        description: 'Nivel de prioridad del mensaje'
        required: true
        type: choice
        options:
          - 💚 Normal
          - 💛 Alta 
          - 🩷 Crítico

jobs:
  transmitir-mensaje: 
    runs-on: ubuntu-latest
    steps:

      - name: Instalar el transmisor de la legión
        run: sudo apt-get install -y cowsay
      
      - name: Transmitir mensaje
        run: |
          echo "====================="
          echo "  Transmisión interceptada"
          echo "====================="
          echo ""
          echo "De: ${{ inputs.villano }}"
          echo ""
          echo "Fecha: $(date -u +"%d/%m/%Y - %H:%M:%S UTC")"
          echo " ------ MENSAJE ------"
          cowsay -f eyes "${{ inputs.mensaje }}"
          echo ""
          echo "------ ${{ inputs.villano }}"
          echo "..."

      - name: Imprimir inputs
        run: |
          echo "Inputs:"
          echo ""
          echo "Villano: ${{ inputs.villano }}"
          echo "Mensaje: ${{ inputs.mensaje }}"
          echo "Nivel: ${{ inputs.prioridad }}"