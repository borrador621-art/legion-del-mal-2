name: Comunicador de la legión


on:
  workflow_dispatch:
    inputs:
      villano:
        description: '¿qué villano envía el mensaje?'
        required: true
        type: choice
        options:
          - Darth Vader
          - Thanos
          - Joker
          - Mistic

jobs:
  transmitir-mensaje: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 