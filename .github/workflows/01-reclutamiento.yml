name: Reclutamiento de Agentes

on: push

jobs: 
    reporte-de-reclutamiento:
        runs-on: ubuntu-latest
        steps:
          
          - name: El agente se presenta
            run: echo "Soy Lex Luthor, y el líder de la legión"
          
          - name: Reporte de identidad
            run: |
              echo "Reporte de identidad"
              echo "==============================="
              echo ""
              echo "Nombre clave: ${{github.actor}}"
              echo ""
              echo "Contexto de GitHub: ${{github.repository}}"
              echo "Repo: ${{github.repository}}"
              echo "Operación: ${{github.sha}}"
              echo "Metadata: ${{ toJson(github) }}"
          
          
              -  name: Capacidades del agente
                run: |
                  echo "capacidades detectadas:"
                  echo "sistema operativo"
                  uname -a
                  echo "habilidades técnicas"
                  node -- version
                  git --version
                  python3 --version
          - name: Reconomiento del terreno
            run: |
                  echo "Reconocimiento del terreno"
                  ls /
